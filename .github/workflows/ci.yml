name: Go CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...
